<title>مسار البطل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e29;--card:#131a3f;--chip:#1c2556;--bd:#2a3470;--tx:#fff;--mu:#9ba3d1;--gold:#ecb83d;--red:#b3404f;--blue:#243a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,system-ui,sans-serif;padding:8px 14px 120px}
h3{margin:0;font-size:22px}
small,.mu{color:var(--mu);font-size:14px}
a{color:var(--mu);text-decoration:underline;font-size:15px}
.card{background:var(--card);border:1.5px solid var(--bd);border-radius:28px;padding:18px;margin:14px 0}
.hero{padding:0;overflow:hidden}
.mat{position:relative;height:300px;background:radial-gradient(ellipse at 50% 84%,rgba(236,184,61,.15),transparent 31%),radial-gradient(ellipse at 50% 44%,rgba(255,255,255,.07),transparent 52%),var(--mb,#0f1538);overflow:hidden;isolation:isolate;image-rendering:pixelated}
.mat i{position:absolute;left:50%;transform:translateX(-50%);border-radius:50%;z-index:0}
.e1{width:125%;height:190px;bottom:-85px;background:var(--e1,var(--blue))}
.e2{width:92%;height:140px;bottom:-60px;background:var(--e2,var(--red))}
.e3{width:62%;height:96px;bottom:-40px;background:var(--e3,var(--gold))}
.mat canvas{position:absolute;left:calc(50% - 96px*var(--cs,1));bottom:var(--cb,3px);z-index:2;transform-origin:50% 98%;filter:drop-shadow(0 3px 2px rgba(5,7,20,.12))}
canvas{image-rendering:pixelated}
.hb{animation:heroIdle 1.8s step-end infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes heroIdle{0%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes heroCelebrate{0%{transform:translateY(0)}12%{transform:translateY(-10px)}26%{transform:translateY(-16px)}42%{transform:translateY(-10px)}58%{transform:translateY(0)}72%{transform:translateY(-4px)}88%{transform:translateY(0)}}
@keyframes cardIdle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(0) scaleY(1.006)}}
.mat:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 13%,rgba(255,255,255,.13),transparent 43%),linear-gradient(180deg,rgba(4,7,25,.02) 42%,rgba(4,7,25,.12));transition:background .25s}
.mat.is-reacting:before{background:radial-gradient(ellipse at 50% 58%,rgba(236,184,61,.22),transparent 40%),radial-gradient(ellipse at 50% 13%,rgba(255,255,255,.18),transparent 43%),linear-gradient(180deg,rgba(4,7,25,.02) 42%,rgba(4,7,25,.12))}
.mat canvas.reacting{animation:heroCelebrate .62s step-end!important;filter:drop-shadow(0 0 13px rgba(236,184,61,.26))}
.ch canvas,.pvw canvas{transform-origin:50% 98%;animation:cardIdle 3.8s ease-in-out infinite;will-change:transform}
.ch canvas:hover,.pvw canvas:hover{filter:drop-shadow(0 3px 8px rgba(236,184,61,.22))}
@keyframes fi{from{opacity:0;transform:translateY(12px)}}
.fade{animation:fi .4s ease}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pad{padding:18px}
.bar{height:16px;background:var(--chip);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.bar u{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),#f08a3c);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.tiers{display:flex;justify-content:space-between;font-size:14px;color:var(--mu)}
.tiers .on{color:#fff;font-weight:800}
.seg{display:flex;background:var(--chip);border-radius:20px;padding:4px}
.seg button{border:0;background:none;color:var(--mu);padding:10px 22px;border-radius:16px;font:inherit;font-weight:800;transition:all .3s}
.seg .on{background:var(--gold);color:#1a1530}
.hr{height:1.5px;background:var(--bd);margin:20px 0}
.chips{display:flex;gap:10px;margin-top:14px}
.chips.w{flex-wrap:wrap}
.chip{flex:1;padding:18px 4px;border:0;border-radius:20px;background:var(--chip);color:#fff;font:inherit;font-weight:800;font-size:17px;transition:background .3s,color .3s,transform .15s}
.chips.w .chip{flex:1 1 28%;padding:13px 4px;font-size:15px}
.chip.on{background:var(--gold);color:#1a1530}
.chip:active,.step button:active,.b:active{transform:scale(.93)}
.step{display:flex;align-items:center;gap:10px;margin-top:14px}
.step button{width:78px;height:68px;border:0;border-radius:20px;background:var(--chip);color:#fff;font-size:30px;transition:transform .15s}
.step div{flex:1;text-align:center;font-size:44px;font-weight:800;line-height:1.1}
.step small{display:block;font-size:14px;font-weight:400}
.in{width:100%;padding:14px;border:0;border-radius:16px;background:var(--chip);color:#fff;font:inherit;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.b{width:100%;margin-top:12px;padding:15px;border:0;border-radius:20px;background:var(--gold);color:#1a1530;font:inherit;font-weight:800;font-size:17px;transition:transform .15s}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1.5px solid var(--bd)}
.x{border:0;background:none;color:var(--mu);font-size:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.ch{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px}
.ch .bar{width:100%}
nav{position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;background:rgba(19,26,63,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid var(--bd);border-radius:30px;padding:6px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:12px;padding:8px 0;border-radius:24px;transition:background .3s,color .3s}
nav button.on{background:var(--chip);color:var(--gold);font-weight:800}
.ar{position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border:0;border-radius:50%;background:rgba(19,26,63,.75);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;transition:transform .15s;z-index:2}
.ar:active{transform:scale(.9)}
.dots{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:center;gap:7px}
.dots b{width:8px;height:8px;border-radius:5px;background:var(--chip);transition:all .3s}
.dots b.on{width:22px;background:var(--gold)}
.mat canvas.sw{animation:heroIdle 1.8s step-end infinite,pf .35s ease}
@keyframes pf{from{opacity:0}}
.days{display:flex;gap:8px;margin-top:20px;align-items:flex-end;height:130px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.days u{display:block;width:100%;border-radius:8px 8px 4px 4px}
.days small{font-size:12px}
.mini{display:flex;align-items:center;gap:14px}
.mini button{width:44px;height:44px;border:0;border-radius:14px;background:var(--chip);color:#fff;font-size:22px;transition:transform .15s}
.mini button:active{transform:scale(.9)}
.mini b{min-width:22px;text-align:center;font-size:20px}
.wkd{display:flex;gap:6px;margin:14px 0}
.dd{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0}
.dd b{width:100%;max-width:46px;height:46px;border-radius:16px;background:var(--chip);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;transition:background .3s,color .3s,transform .15s}
.dd.on b{background:var(--gold);color:#1a1530}
.dd.on{color:#fff}
.dd:disabled{opacity:.35}
.sum{display:flex;align-items:center;justify-content:space-around;text-align:center}

try{S=JSON.parse(localStorage.getItem('fq2')||'null')}catch(e){}
S=S||{days:{},g:{kcal:2500,p:150,steps:8000},name:'مقاتل'};if(S.name=='بيضة'||S.name=='المقاتل')S.name='مقاتل';S.wt=S.wt||{mma:3,bjj:3,wr:2,mt:2,sc:3};S.g.c=S.g.c||250;S.g.f=S.g.f||70;S.own=S.own||{ch:['mma'],cl:['c0'],hr:['h0'],bg:['b0']};S.eq=S.eq||{cl:'c0',hr:'h0',bg:'b0'};S.sp=S.sp||0;S.sch=S.sch||{0:[],1:[],2:[],3:[],4:[],5:[],6:[]};[['b4',55],['b5',60]].forEach(q=>{if(S.own.bg.includes(q[0])){S.own.bg=S.own.bg.filter(x=>x!=q[0]);S.sp-=q[1]}});if(!['b0','b1','b2','b3'].includes(S.eq.bg))S.eq.bg='b0';if(S.own.ch.includes('sc')){S.own.ch=S.own.ch.filter(x=>x!='sc');S.sp-=40}

 const mod=adding?`<div class="ov" onclick="ad(0)"><div class="sh" onclick="event.stopPropagation()"><h3>إضافة وجبة</h3><div class="sc2"><button class="b alt" onclick="scOpen('bc')">📷 مسح باركود</button><button class="b alt" onclick="scOpen('ph')">🍽️ تحليل بالصورة</button></div><div class="hr" style="margin:16px 0 4px"></div><select id="ms" class="in">${ML.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select><input id="mn" class="in" placeholder="اسم الوجبة"><div class="two"><input id="mk" class="in" type="number" placeholder="سعرات"><input id="mp" class="in" type="number" placeholder="بروتين"><input id="mc" class="in" type="number" placeholder="كارب"><input id="mf" class="in" type="number" placeholder="دهون"></div><button class="b" onclick="am()">إضافة الوجبة</button><button class="b" style="background:var(--chip);color:#fff" onclick="ad(0)">إلغاء</button></div></div>`:'';

 <button class="fab" onclick="ad(1)">+</button>${mod}`}

 window.$i=$i;
}
window.scKeyEdit=keyUI;
const PROMPT=`حلّل صورة الوجبة هذي وقدّر مكوناتها وكل مكوّن بوزنه وقيمه الغذائية بالكمية الظاهرة في الصورة (مو لكل 100غ).
أرجع JSON فقط بدون أي نص قبله أو بعده وبدون علامات markdown، بهذا الشكل بالضبط:
{"items":[{"n":"اسم المكوّن بالعربي","g":وزن_بالجرام,"k":سعرات,"p":بروتين_جرام,"c":كارب_جرام,"f":دهون_جرام}],"note":"ملاحظة قصيرة عن دقة التقدير"}
لو الصورة ما فيها أكل أرجع items فاضية.`;
window.scPh=async f=>{
 if(!f)return;
 let url;
 try{url=toCv(await loadImg(f),1280).toDataURL('image/jpeg',.82)}catch(e){return errUI('تعذرت قراءة الصورة.')}
 H(hdr('🍽️ جاري التحليل…')+`<img class="scp" src="${url}"><div class="scw">⏳ أحسب سعرات صحنك…</div>`);
 try{
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':gk(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
   body:JSON.stringify({model:MODEL,max_tokens:1000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:url.split(',')[1]}},{type:'text',text:PROMPT}]}]})});
  const j=await r.json();
  if(!r.ok){return errUI(r.status==401?'المفتاح غير صحيح.':'صار خطأ من الخدمة: '+((j.error&&j.error.message)||r.status),r.status==401)}
  const t=(j.content||[]).filter(x=>x.type=='text').map(x=>x.text).join('');
  const m=t.match(/\{[\s\S]*\}/);if(!m)throw 0;
  const d=JSON.parse(m[0]);
  items=(d.items||[]).map(x=>{const g=+x.g>0?+x.g:100;return{n:String(x.n||'مكوّن'),g,g0:g,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0}});
  if(!items.length)return errUI('ما لقيت أكل في الصورة، جرّب صورة أوضح.');
  phRes(url,d.note||'');
 }catch(e){errUI('تعذر التحليل. تأكد من الاتصال بالإنترنت وجرّب مرة ثانية.')}
};
function errUI(msg,key){

}

 <div id="scl"></div><div class="sct" id="sct"></div>
 ${note?`<small class="mu" style="display:block;margin-top:10px">💡 ${esc(note)}</small>`:''}
 <div style="margin-top:12px">${mealSel()}</div>
 <button class="b" onclick="scAddPh()">إضافة للوجبات</button><button class="b alt" onclick="scOpen('ph')">صورة ثانية</button>`);
 phList();
}
const sc_=x=>x.g/x.g0;
function phList(){
 $i('scl').innerHTML=items.map((x,i)=>`<div class="sci"><div><b>${esc(x.n)}</b><small id="sk${i}"></small></div><input class="in" type="number" inputmode="decimal" value="${Math.round(x.g)}" oninput="scG(${i},this.value)"><small>غ</small><button class="x" onclick="scDel(${i})">✕</button></div>`).join('')||'<small>ما بقي شي</small>';
 phTot();
}
function phTot(){
 let k=0,p=0,c=0,f=0;
 items.forEach((x,i)=>{const s=sc_(x);k+=x.k*s;p+=x.p*s;c+=x.c*s;f+=x.f*s;const e=$i('sk'+i);if(e)e.textContent=Math.round(x.k*s)+' سعرة'});
 $i('sct').innerHTML=`<span style="color:#ff8a3d">🔥 ${Math.round(k)}</span><span style="color:#ff6b6b">بروتين ${r1(p)}g</span><span style="color:#60a5fa">كارب ${r1(c)}g</span><span style="color:#34d399">دهون ${r1(f)}g</span>`;
 return[k,p,c,f];
}
window.scG=(i,v)=>{items[i].g=Math.max(0,+v||0);phTot()};
window.scDel=i=>{items.splice(i,1);phList()};
window.scAddPh=()=>{
 if(!items.length){toast('ما في شي تضيفه');return}
 const t=phTot(),nm=items.map(x=>x.n).join('، ');
 push(nm.length>40?nm.slice(0,38)+'…':nm,t[0],t[1],t[2],t[3]);
};
window.$i=$i;
})();

</script>

 const nx=AC.filter(a=>!S.ach[a.id]).map(a=>({a,r:aprog(a)})).sort((p,q)=>q.r.cur/q.a.t-p.r.cur/p.a.t)[0];
 const hero=`<div class="card ahero"><div class="tt"><div class="lvr"><b>${X.L}</b><small>مستوى</small></div><div style="flex:1"><h3>${RK(X.L)} ${esc(nmOf())}</h3><small>${X.xp.toLocaleString('en-US')} نقطة خبرة</small></div></div>
 ${bw('xp',X.cur/5)}<div class="hd" style="position:relative"><small>${X.cur} / 500</small><small>باقي ${500-X.cur} للمستوى ${X.L+1}</small></div>
 <div class="chp" style="margin-top:12px"><span>🎖️ إتقانات ${X.unA}/${AC.length}</span><span>🎯 تحديات ${X.unC}</span><span>📅 مواعيد منجزة ${X.ev}</span><span>🔥 التزامي ${streaks(d=>tp(d)>=70).cur} يوم</span></div>
 <div class="nxt">${nx?`🎯 الأقرب لك: ${nx.a.ic} ${nx.a.n} · باقي ${nx.a.t-nx.r.cur} يوم`:'🎉 فتحت كل الإتقانات، أسطورة!'}</div></div>`;
 /* قائمة الإتقانات مع فلتر */
 const done=AC.filter(a=>S.ach[a.id]),prog=AC.filter(a=>!S.ach[a.id]).sort((p,q)=>aprog(q).cur/q.t-aprog(p).cur/p.t);
 const list=af=='done'?done:af=='prog'?prog:prog.concat(done);
 const F=[['all','الكل',AC.length],['prog','قيد التقدم',prog.length],['done','مفتوحة',done.length]];
 const mast=`<div class="seg" style="margin:4px 0 6px">${F.map(f=>`<button class="${af==f[0]?'on':''}" style="flex:1;padding:9px 4px;font-size:13px" onclick="setAF('${f[0]}')">${f[1]} · ${f[2]}</button>`).join('')}</div>
 <div class="card" style="padding:6px 16px">${list.map(rowA).join('')||'<small style="display:block;padding:18px 0;text-align:center">ما في شي هنا بعد. كمّل التزامك وبتفتح أول إتقان 💪</small>'}</div>`;
 /* التحديات الشهرية */
 const cc=(c,yy,mm,e,n)=>`<div class="mc w${e?'':' lkd'}" style="--ac:${CHC[c.id]}">${e?'<i class="bdg">✓</i>':''}${chMd(c,yy,mm,!e)}<b>${c.n} لشهر ${MN[mm-1]}</b>${e?'<span class="pv">مكتمل 🎉</span>':`<small>ينتهي ${mm}/${last}</small><div style="width:100%;padding:0 10px">${bw('ch'+c.id,n/c.t*100,GR)}</div><small><b style="color:var(--ac)">${n}</b> / ${c.t} يوم</small>`}</div>`;
 const cur=CH.map(c=>cc(c,y,mo,S.chl['c'+y+'-'+mo+'-'+c.id],cntMonth(c.f))).join('');
 const past=Object.keys(S.chl).filter(k=>!k.startsWith('c'+y+'-'+mo+'-')).sort().reverse().map(k=>{const m=k.match(/^c(\d+)-(\d+)-(\w+)$/);const c=m&&CH.find(x=>x.id==m[3]);return c?cc(c,+m[1],+m[2],1,0):''}).join('');
 /* الأرقام القياسية */
 const maxD=f=>Math.max(0,...Object.values(S.days).map(f));
 const PB=[['🔥','أطول التزام متواصل',streaks(d=>tp(d)>=70).best,v=>v+' يوم','#ff7a45'],['💯','أعلى نقاط في يوم',maxD(tp),v=>v+' / 100','#f5b82e'],['🥗','أطول أكل صحي',streaks(d=>P(d).f>=PW.f).best,v=>v+' يوم','#34d399'],['😴','أطول نوم 7س+',streaks(d=>!!d&&d.sleep>=7).best,v=>v+' يوم','#a78bfa'],['👟','أعلى خطوات بيوم',maxD(d=>d.steps||0),v=>fmtN(v),'#3b9cff'],['🏋️','أيام التمرين',trDays(),v=>v+' يوم','#ff5d8f']]
  .map(q=>`<div class="pbc${q[2]?'':' z'}" style="--ac:${q[4]}"><span class="pbi">${q[0]}</span><b class="pbv">${q[2]?q[3](q[2]):'—'}</b><small>${q[1]}</small></div>`).join('');
 /* المواعيد المنجزة من التقويم */
 const evd=(S.ev||[]).filter(e=>e.done).sort((a,b)=>a.d<b.d?1:-1);
 const evh=evd.length?`<div class="card" style="padding:6px 16px">${evd.slice(0,8).map(e=>`<div class="alr un" style="--ac:#ecb83d"><div class="ai">${EI[e.k]||'📌'}<i>✓</i></div><div style="flex:1;min-width:0"><div class="hd"><b>${esc(e.n)}</b><span class="apc">${fdS(e.d)}</span></div>${e.note?`<small>${esc(e.note)}</small>`:''}</div></div>`).join('')}</div>`
  :`<div class="card"><small>أنجز موعد من التقويم (بطولة، اختبار حزام…) وبيظهر هنا كإنجاز 🏆</small><button class="b alt" onclick="go('cal')">افتح التقويم</button></div>`;
 return hero+heat()+sec('الإتقانات','🎖️','#a78bfa',X.unA+' / '+AC.length,mast)
  +sec('التحديات','🎯','#ff7a45',CH.length+' هالشهر','<div class="rw">'+cur+past+'</div>')
  +sec('أرقامك القياسية','⚡','#f5b82e','6',`<div class="pbg">${PB}</div>`)
  +sec('مواعيد أنجزتها','📅','#ecb83d',evd.length+'',evh)
  +`<small style="display:block;margin-top:14px">اضغط على أي إتقان تشوف شهادته وتثبتها في الصفحة الرئيسية. نقاط الخبرة تجمع نقاط أيامك + مكافآت الإتقانات والتحديات والمواعيد المنجزة.</small>`;
}
views.ach=ach2;
})();

</script>
